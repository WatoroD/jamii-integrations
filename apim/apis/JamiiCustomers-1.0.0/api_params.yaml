# Environment-specific overrides applied by `apictl import api --params`.
environments:
- name: dev
  configs:
    endpoints:
      production:
        url: http://jamii-mi:8290/customers
      sandbox:
        url: http://jamii-mi:8290/customers
    deploymentEnvironments:
    - displayOnDevportal: true
      deploymentEnvironment: Default
- name: prod
  configs:
    endpoints:
      production:
        url: https://mi.prod.jamii.internal:8253/customers
      sandbox:
        url: https://mi.uat.jamii.internal:8253/customers
    deploymentEnvironments:
    - displayOnDevportal: true
      deploymentEnvironment: Default
