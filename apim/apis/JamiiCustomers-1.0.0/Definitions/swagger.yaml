openapi: 3.0.1
info:
  title: JamiiCustomers
  version: 1.0.0
  description: |
    Jamii customer profile (managed proxy over the customer master, mocked by DummyJSON) and the
    customer dashboard aggregation (profile + accounts, fetched in parallel).
servers:
  - url: https://localhost:8243/jamii/customers/1.0.0
security:
  - default: []
paths:
  /{customerId}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer profile (sensitive fields removed)
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Customer profile. Secrets and high-risk PII (password, SSN, bank card, crypto wallet, IP/MAC, biometrics) are stripped by the gateway.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Customer"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown customer (CUSTOMER_NOT_FOUND).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "502":
          description: Customer backend returned an unexpected response (BACKEND_ERROR).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /{customerId}/dashboard:
    get:
      tags: [Customers]
      operationId: getCustomerDashboard
      summary: Profile and accounts in one call (partial results flagged)
      description: |
        Calls the customer backend and the accounts database in parallel. If exactly one source
        fails, returns 200 with "partial": true and the failed section marked UNAVAILABLE.
        If the customer does not exist returns 404; if both sources fail returns 503.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Dashboard (possibly partial).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerDashboard"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown customer (CUSTOMER_NOT_FOUND).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Jamii customer ID (positive integer).
      schema: {type: string, pattern: "^[1-9][0-9]{0,8}$", example: "1"}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation ID (8-64 chars, [A-Za-z0-9._:-]). Generated if absent or invalid.
      schema: {type: string, pattern: "^[A-Za-z0-9._:\\-]{8,64}$"}
  schemas:
    Customer:
      type: object
      description: Customer profile as held by the customer master, minus stripped fields.
      additionalProperties: {}
      properties:
        id: {type: integer}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        birthDate: {type: string}
        address: {type: object, additionalProperties: {}}
        company: {type: object, additionalProperties: {}}
    DashboardSectionStatus:
      type: string
      enum: [OK, UNAVAILABLE]
    CustomerDashboard:
      type: object
      required: [customerId, partial, profile, accounts, requestId, timestamp]
      properties:
        customerId: {type: string}
        partial: {type: boolean, description: true when any section is UNAVAILABLE}
        profile:
          type: object
          required: [status]
          properties:
            status: {$ref: "#/components/schemas/DashboardSectionStatus"}
            reason: {type: string, enum: [TIMEOUT, UNAVAILABLE, BACKEND_ERROR]}
            data:
              type: object
              properties:
                firstName: {type: string}
                lastName: {type: string}
                email: {type: string}
                phone: {type: string}
        accounts:
          type: object
          required: [status]
          properties:
            status: {$ref: "#/components/schemas/DashboardSectionStatus"}
            reason: {type: string, enum: [TIMEOUT, UNAVAILABLE, DATABASE_UNAVAILABLE]}
            data:
              type: array
              items:
                type: object
                properties:
                  accountNumber: {type: string}
                  accountType: {type: string}
                  status: {type: string, enum: [ACTIVE, DORMANT, CLOSED]}
                  balance:
                    type: object
                    properties:
                      amount: {type: number}
                      currency: {type: string}
        requestId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
    ErrorResponse:
      type: object
      description: Common error envelope returned by every Jamii API, whatever the backend.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status, requestId, timestamp]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: ACCOUNT_NOT_FOUND
            message:
              type: string
              description: Human-readable, client-safe message. Never contains backend internals.
            status:
              type: integer
              description: Mirrors the HTTP status code.
              example: 404
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
            details:
              type: string
              description: Optional validation detail (only for INVALID_REQUEST).
  responses:
    BadRequest:
      description: Malformed input (invalid path parameter or request body).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: Missing or invalid credentials (generated by the API Manager gateway).
    TooManyRequests:
      description: Subscription tier quota exceeded (generated by the API Manager gateway).
    ServiceUnavailable:
      description: Backend unavailable (DATABASE_UNAVAILABLE / BACKEND_UNAVAILABLE).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    GatewayTimeout:
      description: Backend did not answer in time (BACKEND_TIMEOUT).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  headers:
    X-Request-ID:
      description: Unique ID of this request (equals requestId in the body).
      schema: {type: string, format: uuid}
    X-Correlation-ID:
      description: Echo of the caller correlation ID, or a generated one.
      schema: {type: string}
  securitySchemes:
    default:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
x-wso2-auth-header: Authorization
x-wso2-basePath: /jamii/customers/1.0.0
