openapi: 3.0.1
info:
  title: JamiiAccounts
  version: 1.0.0
  description: |
    Jamii Savings account balance enquiry. Backed by the core accounts database through
    WSO2 Micro Integrator data services.
  contact:
    name: Jamii Integration Team
    email: integration@jamii.example
servers:
  - url: https://localhost:8243/jamii/accounts/1.0.0
security:
  - default: []
paths:
  /{accountNumber}/balance:
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get the current balance and status of an account
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: 10-digit Jamii account number.
          schema:
            type: string
            pattern: "^[0-9]{10}$"
            example: "1000000001"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Account found.
          headers:
            X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
            X-Correlation-ID: {$ref: "#/components/headers/X-Correlation-ID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountBalance"}
              example:
                accountNumber: "1000000001"
                status: ACTIVE
                balance: {amount: 152340.75, currency: KES}
                requestId: 3f0c8f0e-6a8e-4c1f-9b55-0d8f4b6e2a71
                timestamp: "2026-10-13T08:15:30.123Z"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown account (ACCOUNT_NOT_FOUND).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
        "504": {$ref: "#/components/responses/GatewayTimeout"}
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
components:
  schemas:
    AccountBalance:
      type: object
      required: [accountNumber, status, balance, requestId, timestamp]
      properties:
        accountNumber: {type: string, pattern: "^[0-9]{10}$"}
        status: {type: string, enum: [ACTIVE, DORMANT, CLOSED]}
        balance:
          type: object
          required: [amount, currency]
          properties:
            amount: {type: number, format: double, example: 152340.75}
            currency: {type: string, pattern: "^[A-Z]{3}$", example: KES}
        requestId: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
    ErrorResponse:
      type: object
      description: Common error envelope returned by every Jamii API, whatever the backend.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status, requestId, timestamp]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              example: ACCOUNT_NOT_FOUND
            message:
              type: string
              description: Human-readable, client-safe message. Never contains backend internals.
            status:
              type: integer
              description: Mirrors the HTTP status code.
              example: 404
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
            details:
              type: string
              description: Optional validation detail (only for INVALID_REQUEST).
  responses:
    BadRequest:
      description: Malformed input (invalid path parameter or request body).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: Missing or invalid credentials (generated by the API Manager gateway).
    TooManyRequests:
      description: Subscription tier quota exceeded (generated by the API Manager gateway).
    ServiceUnavailable:
      description: Backend unavailable (DATABASE_UNAVAILABLE / BACKEND_UNAVAILABLE).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    GatewayTimeout:
      description: Backend did not answer in time (BACKEND_TIMEOUT).
      headers:
        X-Request-ID: {$ref: "#/components/headers/X-Request-ID"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  headers:
    X-Request-ID:
      description: Unique ID of this request (equals requestId in the body).
      schema: {type: string, format: uuid}
    X-Correlation-ID:
      description: Echo of the caller correlation ID, or a generated one.
      schema: {type: string}
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation ID (8-64 chars, [A-Za-z0-9._:-]). Generated if absent or invalid.
      schema: {type: string, pattern: "^[A-Za-z0-9._:\\-]{8,64}$"}
  securitySchemes:
    default:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
x-wso2-auth-header: Authorization
x-wso2-basePath: /jamii/accounts/1.0.0
