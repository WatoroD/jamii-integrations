# apictl project for JamiiLoans 1.0.0 (APIM 4.4). Endpoint URLs are overridden per environment by api_params.yaml.
type: api
version: v4.4.0
data:
  name: JamiiLoans
  description: 'Loan eligibility pre-check: JSON facade over a legacy SOAP affordability engine.'
  context: /jamii/loans
  version: 1.0.0
  provider: admin
  lifeCycleStatus: PUBLISHED
  isDefaultVersion: true
  isRevision: false
  type: HTTP
  transport:
  - https
  tags:
  - jamii
  - loans
  - soap
  policies:
  - Bronze
  apiThrottlingPolicy: Unlimited
  authorizationHeader: Authorization
  apiKeyHeader: apikey
  securityScheme:
  - api_key
  - oauth_basic_auth_api_key_mandatory
  visibility: PUBLIC
  visibleRoles: []
  accessControl: NONE
  responseCachingEnabled: false
  cacheTimeout: 300
  enableSchemaValidation: false
  businessInformation:
    businessOwner: Jamii Digital Channels
    businessOwnerEmail: digital@jamii.example
    technicalOwner: Jamii Integration Team
    technicalOwnerEmail: integration@jamii.example
  corsConfiguration:
    corsConfigurationEnabled: false
    accessControlAllowOrigins:
    - '*'
    accessControlAllowCredentials: false
    accessControlAllowHeaders:
    - authorization
    - apikey
    - Content-Type
    - X-Correlation-ID
    accessControlAllowMethods:
    - GET
    - POST
  endpointConfig:
    endpoint_type: http
    production_endpoints:
      url: http://jamii-mi:8290/loans
    sandbox_endpoints:
      url: http://jamii-mi:8290/loans
  endpointImplementationType: ENDPOINT
  operations:
  - id: ''
    target: /eligibility
    verb: POST
    authType: Application
    throttlingPolicy: Unlimited
    scopes: []
    usedProductIds: []
    operationPolicies:
      request:
      - policyName: jamiiConsumerContext
        policyVersion: v1
        policyType: api
        parameters:
          correlationHeader: X-Correlation-ID
          channel: partner-api
      response: []
      fault: []
  gatewayVendor: wso2
  gatewayType: wso2/synapse
  asyncTransportProtocols: []
